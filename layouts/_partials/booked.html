{{- $lp := .Site.Language.Params -}}
{{- with $lp.bookedUntil -}}
<div class="booked-wrap">
  <span class="booked"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>{{ $lp.bookedLabel }} {{ . }}</span>
  <details class="waitlist" style="border:0">
    <summary class="link-arrow" style="padding:0;font-size:var(--t-s);font-family:var(--font-body);letter-spacing:0">{{ i18n "waitlist" }}</summary>
    <p class="small muted" style="margin:.6rem 0">{{ i18n "waitlistHint" }}</p>
    {{ with site.Params.formAction }}<form method="post" action="{{ . }}"><div class="field"><label>{{ i18n "guideEmail" }}</label><input type="email" name="EMAIL" required autocomplete="email"></div><input type="hidden" name="LIST" value="waitlist"><input type="hidden" name="LANG" value="{{ $.Language.Lang }}"><button class="btn btn-solid btn-arrow" type="submit">{{ i18n "guideSubmit" }}</button></form>{{ else }}<p class="small muted">{{ i18n "guideSoon" }}</p>{{ end }}
  </details>
</div>
{{- end -}}
