# L’Arbre de vie tel que la Golden Dawn l’a mis en carte (disposition de Kircher, sentiers 11 à 32).
# Une seule saisie pour le dessin ({{< tree-of-life >}}) et pour la place de chaque carte sur l’Arbre (pages des cartes) : positions, noms, sentiers. Les lettres et les noms
# des arcanes viennent de data/cards.yml, pour que la table des lettres et le dessin ne puissent pas diverger.
# Coordonnées dans un repère 400 × 690 : colonne de gauche (Rigueur) x = 70, milieu x = 200, droite (Miséricorde) x = 330.
sephirot:
  - { key: keter,    n: 1,  x: 200, y: 42,  en: Keter,    fr: Keter,    en_t: Crown,         fr_t: Couronne,     slug_en: keter,    slug_fr: keter, he: "כתר", planet_en: "the Primum Mobile", planet_fr: "le Premier Mobile" }
  - { key: chokhmah, n: 2,  x: 330, y: 120, en: Chokhmah, fr: Hokhmah,  en_t: Wisdom,        fr_t: Sagesse,      slug_en: chokhmah, slug_fr: hokhmah, he: "חכמה", planet_en: "the zodiac", planet_fr: "le zodiaque" }
  - { key: binah,    n: 3,  x: 70,  y: 120, en: Binah,    fr: Binah,    en_t: Understanding, fr_t: Intelligence, slug_en: binah,    slug_fr: binah, he: "בינה", planet_en: "Saturn", planet_fr: "Saturne" }
  - { key: chesed,   n: 4,  x: 330, y: 276, en: Chesed,   fr: Hesed,    en_t: Mercy,         fr_t: Grâce,        slug_en: chesed,   slug_fr: hesed, he: "חסד", planet_en: "Jupiter", planet_fr: "Jupiter" }
  - { key: gevurah,  n: 5,  x: 70,  y: 276, en: Gevurah,  fr: Gevurah,  en_t: Strength,      fr_t: Rigueur,      slug_en: gevurah,  slug_fr: gevurah, he: "גבורה", planet_en: "Mars", planet_fr: "Mars" }
  - { key: tiferet,  n: 6,  x: 200, y: 354, en: Tiferet,  fr: Tiferet,  en_t: Beauty,        fr_t: Beauté,       slug_en: tiferet,  slug_fr: tiferet, he: "תפארת", planet_en: "the Sun", planet_fr: "le Soleil" }
  - { key: netzach,  n: 7,  x: 330, y: 432, en: Netzach,  fr: Netzah,   en_t: Victory,       fr_t: Victoire,     slug_en: netzach,  slug_fr: netzah, he: "נצח", planet_en: "Venus", planet_fr: "Vénus" }
  - { key: hod,      n: 8,  x: 70,  y: 432, en: Hod,      fr: Hod,      en_t: Splendour,     fr_t: Gloire,       slug_en: hod,      slug_fr: hod, he: "הוד", planet_en: "Mercury", planet_fr: "Mercure" }
  - { key: yesod,    n: 9,  x: 200, y: 510, en: Yesod,    fr: Yesod,    en_t: Foundation,    fr_t: Fondement,    slug_en: yesod,    slug_fr: yesod, he: "יסוד", planet_en: "the Moon", planet_fr: "la Lune" }
  - { key: malkhut,  n: 10, x: 200, y: 627, en: Malkhut,  fr: Malkhout, en_t: Kingdom,       fr_t: Royaume,      slug_en: malkhut,  slug_fr: malkhout, he: "מלכות", planet_en: "the elements", planet_fr: "les éléments" }

# Le sens des lettres reprend mot pour mot la table de la page des lettres hébraïques.
# Sentiers de la Golden Dawn : numéro, sphères reliées, arcane, glyphe hébreu et famille de la lettre
# (mère, double, simple, selon le Sefer Yetzirah). t place l’étiquette le long du trait (0,5 = au milieu) ;
# il ne bouge que là où une étiquette tomberait sur un croisement (13, 14, 19, 25 et 27 croisent d’autres sentiers).
paths:
  - { n: 11, from: keter,    to: chokhmah, card: ar00, glyph: "א", kind: mother, means_en: "ox", means_fr: "bœuf" }
  - { n: 12, from: keter,    to: binah,    card: ar01, glyph: "ב", kind: double, means_en: "house", means_fr: "maison" }
  - { n: 13, from: keter,    to: tiferet,  card: ar02, glyph: "ג", kind: double, t: 0.42, means_en: "camel", means_fr: "chameau" }
  - { n: 14, from: chokhmah, to: binah,    card: ar03, glyph: "ד", kind: double, t: 0.3, means_en: "door", means_fr: "porte" }
