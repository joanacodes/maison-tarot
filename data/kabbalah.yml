  - { n: 21, from: chesed,   to: netzach,  card: ar10, glyph: "כ", kind: double, means_en: "palm of the hand", means_fr: "paume de la main" }
  - { n: 22, from: gevurah,  to: tiferet,  card: ar11, glyph: "ל", kind: simple, means_en: "ox-goad", means_fr: "aiguillon à bœufs" }
  - { n: 23, from: gevurah,  to: hod,      card: ar12, glyph: "מ", kind: mother, means_en: "water", means_fr: "eau" }
