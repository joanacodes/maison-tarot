# Les figures de cour sur l’Arbre (convention de ce site, cf. les pages Chokhmah et Tiferet : le Roi du Rider-Waite-Smith
# est le Roi monté de la Golden Dawn, le Cavalier son Prince). Clé = numéro de la carte dans data/cards.yml.
courts: { "14": chokhmah, "13": binah, "12": tiferet, "11": malkhut }
