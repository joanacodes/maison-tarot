fr:
  - Diagnostics de santé et questions médicales.
  - La mort — la vôtre ou celle d’un proche.
  - La grossesse.
  - Les procédures juridiques en cours.
  - Les placements et décisions financières.
  - Les « malédictions à lever » et tout « travail » payant pour vous en libérer. C’est la définition même de l’arnaque.
  - Les mineurs.
en:
  - Health diagnoses and medical questions.
  - Death — yours or a loved one’s.
  - Pregnancy.
  - Ongoing legal proceedings.
  - Investments and financial decisions.
  - “Curses to lift” and any paid “work” to free you from one. That is the very definition of a scam.
  - Minors.
