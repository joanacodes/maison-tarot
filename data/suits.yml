- key: major
  fr: { name: "Arcanes majeurs", element: "Les quatre", energy: "Les deux", count: "22 cartes", kw: "Les grandes étapes — ce qui vous arrive, pas ce que vous faites.", text: "Vingt-deux cartes numérotées de 0 à 21. Elles parlent des passages : ce qui s’impose, ce qui change de fond en comble. Quand un tirage en est plein, la situation dépasse la personne ; quand il n’y en a aucun, tout est entre ses mains." }
  en: { name: "Major arcana", element: "All four", energy: "Both", count: "22 cards", kw: "The big steps — what happens to you, not what you do.", text: "Twenty-two cards numbered 0 to 21. They speak of passages: what imposes itself, what changes top to bottom. When a spread is full of them, the situation is bigger than the person; when there are none, everything is in their hands." }
- key: wands
  fr: { name: "Bâtons", element: "Feu", energy: "Masculine", count: "14 cartes", kw: "Création, destruction, impulsion. Ce qu’on lance — et ce qu’on brûle en route.", text: "As, deux à dix, puis Valet, Cavalier, Reine, Roi. La famille de l’élan : le projet, l’envie, la vitesse. Beaucoup de Bâtons : ça va vite, dans un sens ou dans l’autre." }
  en: { name: "Wands", element: "Fire", energy: "Masculine", count: "14 cards", kw: "Creation, destruction, impulse. What you launch — and what you burn on the way.", text: "Ace, two to ten, then Page, Knight, Queen, King. The house of drive: the project, the urge, the speed. Many Wands: it’s going fast, one way or the other." }
- key: cups
  fr: { name: "Coupes", element: "Eau", energy: "Féminine", count: "14 cartes", kw: "Les émotions, les relations, ce qui coule — ou ce qui s’infiltre.", text: "La famille de ce qui se ressent. Une relation, un deuil, une joie, une émotion négligée depuis longtemps. Beaucoup de Coupes : la question n’est pas « qu’est-ce qui arrive » mais « qu’est-ce qui circule »." }
  en: { name: "Cups", element: "Water", energy: "Feminine", count: "14 cards", kw: "Emotions, relationships, what flows — or what seeps in.", text: "The house of what is felt. A relationship, a grief, a joy, an emotion neglected for a long time. Many Cups: the question isn’t “what’s happening” but “what’s flowing”." }
- key: swords
  fr: { name: "Épées", element: "Air", energy: "Masculine", count: "14 cartes", kw: "Le mental, l’analyse, la décision. Ce qui se passe dans la tête.", text: "Pas la violence d’abord : la pensée. Ce qu’on rumine, ce qu’on tranche, ce qu’on se fait dicter. Beaucoup d’Épées : quelqu’un réfléchit trop, décide beaucoup, ou laisse quelqu’un décider pour lui." }
  en: { name: "Swords", element: "Air", energy: "Masculine", count: "14 cards", kw: "The mind, analysis, decision. What goes on in the head.", text: "Not violence first: thought. What you ruminate, what you cut, what you let others dictate. Many Swords: someone thinks too much, decides a lot, or lets someone decide for them." }
- key: pentacles
  fr: { name: "Pentacles", element: "Terre", energy: "Féminine", count: "14 cartes", kw: "La matière, la valeur, le résultat du travail. Ce qui tient.", text: "L’argent, oui, mais surtout ce qui compte : une maison, un corps, un travail, une relation qui nourrit. Beaucoup de Pentacles : la personne tient bon — ou s’accroche." }
  en: { name: "Pentacles", element: "Earth", energy: "Feminine", count: "14 cards", kw: "Matter, value, the result of work. What holds.", text: "Money, yes, but above all what matters: a home, a body, a job, a relationship that feeds you. Many Pentacles: the person is holding steady — or holding on." }
