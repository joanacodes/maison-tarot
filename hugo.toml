# Maison Tarot — configuration Hugo
# Un seul domaine canonique. Remplacer avant le premier déploiement (et dans .github/workflows/deploy.yml).
baseURL = "https://www.maisontarot.example/"
title = "Maison Tarot"
enableRobotsTXT = true
timeZone = "Europe/Paris"
disableKinds = ["taxonomy", "term"]

# ——— Langues : l'anglais est le site principal (racine), le français vit sous /fr/. Bandeau qui propose, jamais de redirection.
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false

[languages]
  [languages.fr]
    label = "Français"
    locale = "fr-FR"
    contentDir = "content/fr"
    weight = 2
    [languages.fr.params]
      locale = "fr_FR"
      dateFormat = "2 January 2006"
      email = "bonjour@maisontarot.fr"
      authorName = "Joana de Maison Tarot"
      authorShortDescription = "Joana lit et enseigne le tarot depuis Paris, en français et en anglais. Depuis 2020, elle a fait environ trois cents tirages gratuits pour des inconnus qui ne lui disaient rien, et compté ses ratés : environ un sur dix. Elle enseigne cinq clés de lecture plutôt que 78 significations. Les cartes ne sont pas magiques. Vous, si."
      bookedUntil = "février 2027"      # vide = pas de badge
      bookedLabel = "Disponible en"
      guideFile = "/guide/maison-tarot-guide-du-lecteur.pdf"
  [languages.en]
    label = "English"
    locale = "en-GB"
    contentDir = "content/en"
    weight = 1
    [languages.en.params]
      locale = "en_GB"
      dateFormat = "2 January 2006"
      email = "hello@maisontarot.co.uk"
      authorName = "Joana from Maison Tarot"
      authorShortDescription = "Joana reads and teaches tarot from Paris, in English and French. Since 2020 she has read for about three hundred strangers who told her nothing, for free, and counted her misses: about one in ten. She teaches five lenses instead of 78 meanings. The cards aren’t magic. You are."
      bookedUntil = "February 2027"
      bookedLabel = "Available in"
      guideFile = "/guide/maison-tarot-readers-guide.pdf"

[params]
  brand = "Maison Tarot"
  tagline = "Demystify mysticism."
  defaultImage = "/og-default.png"   # image de partage par défaut (1200×630)
  # Cal.com : "utilisateur/type" (vide = réservation fermée, aucun bouton mort)
  calLink = ""
  # Brevo (ou autre) : URL d'action du formulaire du Guide du lecteur (vide = formulaire désactivé)
  formAction = ""
  # Formulaire d'inscription aux événements (vide = le dialogue affiche « bientôt » ; le lien de l'événement reste utilisable)
  eventFormAction = ""
  [params.podcast]
    spotify = ""     # URL de l'émission sur chaque plateforme (vide = bouton masqué)
    apple = ""
    deezer = ""
    youtube = ""
    cadence_fr = "Nouvel épisode tous les jeudis"
    cadence_en = "New episodes every Thursday"
  [params.author]
    name = "Joana from Maison Tarot"   # nom par défaut ; chaque langue a le sien (languages.<lang>.params.authorName), c'est lui qu'on affiche
    image = "author.jpg"  # portrait dans assets/ (carré, ≥ 800 px) — placeholder tant qu'il manque
    jobTitle = "Tarot reader and teacher"
    handle = "maisontarot"
    basedIn = "Paris"
    email = "hello@maisontarot.co.uk"   # contact par langue : languages.<lang>.params.email
    sameAs = [
      "https://instagram.com/maisontarot",
      "https://www.youtube.com/@maisontarot",
      "https://www.tiktok.com/@maisontarot",
      "https://www.threads.net/@maisontarot",
      "https://x.com/maisontarot",
      "https://www.facebook.com/maisontarot",
      "https://www.reddit.com/user/maisontarot",
      "https://www.pinterest.com/maisontarot",
      "https://maisontarot.tumblr.com",
      "https://medium.com/@maisontarot",
      "https://maisontarot.substack.com",
    ]
  [params.legal]
    publisherName = "Joana Mehou-Loko EI"   # nom légal ; « EI » obligatoire depuis 2022 à côté du nom d'un entrepreneur individuel
    status = "Entrepreneur individuel (EI)"
    address = "47 rue Vivienne, 75002 Paris"   # adresse professionnelle : c'est elle qui s'affiche, jamais le domicile
    siren = "908 032 139"
    director = "Joana Mehou-Loko"   # directrice de la publication (mention légale), distincte du nom d'autrice affiché sous les articles
    phone = ""           # [À COMPLÉTER] téléphone exigé par la LCEN pour une personne physique ; un numéro professionnel suffit
    hostName = "GitHub, Inc."
    hostAddress = "88 Colin P. Kelly Jr. Street, San Francisco, CA 94107, USA"
    hostPhone = "+1 877 448 4820"
    mediator = ""        # [À COMPLÉTER] médiateur de la consommation
  [params.numbers]
    readings = 300
    hitRate = "≈ 90 %"
    chartOverall = "30–40 %"
    chartSLC = "75–90 %"

enableGitInfo = true

[frontmatter]
  lastmod = [":git", "lastmod", "date"]

[related]
  includeNewer = true
  threshold = 50
  toLower = true
  [[related.indices]]
    name = "tags"
    weight = 100
  [[related.indices]]
    name = "categories"
    weight = 40

[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.goldmark.extensions]
    typographer = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 2

[imaging]
  quality = 82
  resampleFilter = "Lanczos"

[sitemap]
  changefreq = "weekly"
  priority = 0.5

[outputs]
  home = ["HTML", "SearchIndex"]
  section = ["HTML"]
  page = ["HTML"]

[minify]
  minifyOutput = true

[security]
  enableInlineShortcodes = false

